{s:'РОЗДІЛ I',c:'Загальні',t:'ЗАГАЛЬНІ ПОЛОЖЕННЯ',r:[['Презумпція невинуватості',['Особа вважається невинуватою у вчиненні правопорушення, доки її вину не буде доведено в порядку, передбаченому цим Кодексом.','Усі сумніви щодо винуватості особи трактуються на користь цієї особи.']],['Законність дій працівників правоохоронних органів',['Працівники правоохоронних органів зобов’язані діяти виключно на підставі та в межах повноважень, передбачених законодавством та правилами сервера.','Забороняються будь-які прояви самоуправління, перевищення службових повноважень або необґрунтованого застосування сили.']]]},
{s:'РОЗДІЛ II',c:'Затримання',t:'ПОРЯДОК ТА СТАДІЇ ЗАТРИМАННЯ',r:[['📋 Покроковий алгоритм затримання',['Затримання особи має здійснюватися чітко за вказаним алгоритмом. Порушення послідовності є підставою для звільнення затриманої особи.']],['Ідентифікація працівника',['Представитися (назвати посаду, звання та прізвище) або надати службове посвідчення / бейджик (через /me або системний функціонал).']],['Озвучення причини затримання',['Чітко повідомити громадянину підставу затримання (стаття ККУ/АКУ або факт виявленого правопорушення).']],['Застосування спецзасобів',['Одягнути кайданки (тайзер / затримання) з обов’язковим відіграванням.']],['Зачитування прав (Правило Міранди)',['Зачитати права особи вголос або в ігровий чат.']],['Встановлення особи',['Перевірити документи (паспорт, посвідчення водія) або встановити особу через планшет / фотобазу.']],['Первинний / поверхневий огляд',['Перевірити особу на наявність нелегальної зброї, боєприпасів або речовин.']],['Транспортування',['Посадити підозрюваного до службового авто та доставити до відділку (НПУ / СБУ) або підрозділу ДКВС.']],['Вторинний обшук та допит (за потреби)',['Провести повний обшук, вилучити заборонені предмети. За потреби — надати право на дзвінок/адвоката.']],['Текст Міранди',['Під час затримання співробітник правоохоронних органів зобов’язаний зачитати наступний текст:','«Ви маєте право зберігати мовчання. Все, що ви скажете, може і буде використано проти вас у суді.','Ви маєте право на один телефонний дзвінок тривалістю до 3 хвилин.','Ви маєте право на один візит державного або приватного адвоката.','Якщо ви не можете оплатити послуги адвоката, вам буде надано державного.','Вам зрозумілі ваші права?»']]],n:'<b>Примітка:</b> Якщо затриманий відповідає «Ні», співробітник зобов’язаний повторити Міранду ще один раз. Якщо після цього відповідь знову негативна — повторне зачитування не вимагається.'},
{s:'РОЗДІЛ IV',c:'Підстави',t:'ПІДСТАВИ ДЛЯ ЗАТРИМАННЯ ТА ОБШУКУ',r:[['Підстави для затримання громадян',['Особа може бути затримана у разі:','• Застання особи безпосередньо під час вчинення злочину або правопорушення.','• Наявності орієнтування, фотофіксації або рішення суду/прокуратури про затримання.','• Якщо на особі, її одязі, в автівці або в речах виявлено явні сліди злочину (зброя без ліцензії, наркотичні речовини тощо).','• Перебування особи у розшуку (за базами даних).']],['Поверхневий перевірочний огляд та обшук',['Первинний огляд проводиться на місці затримання з метою безпеки працівників (пошук колючо-ріжучих предметів, вогнепальної зброї).','Повний обшук проводиться виключно у приміщенні відділку (НПУ/СБУ) перед поміщенням особи до КПЗ/ІТТ.','Під час повного обшуку вилучаються:','• Нелегальна зброя та боєприпаси.','• Наркотичні та психотропні речовини.','• Відмички, спецзасоби та маски (якщо це передбачено правилами сервера).']]]},
{s:'РОЗДІЛ V',c:'Права',t:'ПРАВА ЗАТРИМАНОГО ТА ЗАЛУЧЕННЯ АДВОКАТА',r:[['Право на адвоката та телефонний дзвінок',['Затриманий має право вимагати надання адвоката до моменту поміщення в КПЗ.','У разі виклику адвоката, співробітник правоохоронних органів зобов’язаний зробити запит у рацію/Discord-канал колегії адвокатів та зачекати 10–15 хвилин.','Якщо адвокат не прийняв виклик або не прибув протягом визначеного часу, процесуальні дії продовжуються без його участі.','Затриманий має право на один телефонний дзвінок (тривалістю до 3 хвилин) у присутності співробітника.']]]}

['Ст. 2','Задачи судебной власти','',['1. Задачей судебной власти является защита прав, свобод и законных интересов физических и юридических лиц, интересов общества и государства путём осуществления правосудия на основе верховенства права.']],
['Ст. 3','Основные принципы правосудия','',['1. Верховенство права: Правосудие осуществляется на основе верховенства права и уважения прав человека.','2. Независимость судей: Судьи при осуществлении правосудия независимы и подчиняются только закону. Влияние на судей любым способом запрещается.','3. Равенство всех участников процесса: Все участники судебного процесса равны перед законом и судом.','4. Гласность и открытость: Рассмотрение дел в судах является открытым, кроме случаев, определённых законом для защиты государственной или иной тайны.','5. Состязательность сторон: Стороны имеют равные права на представление доказательств, их исследование и доказывание перед судом их убедительности.','6. Обязательность судебных решений: Судебное решение, вступившее в законную силу, является обязательным к исполнению на всей территории.']]]},
{b:3,i:'👨‍⚖️',s:'КОДЕКС СУДЕБНОЙ ВЛАСТИ',c:'Судьи',t:'СТАТУС И ПОЛНОМОЧИЯ СУДЕЙ',r:[
['Ст. 4','Статус судьи и гарантии независимости','',['1. Судейская неприкосновенность и гарантии: Независимость судьи обеспечивается особым порядком его назначения, избрания, привлечения к ответственности и увольнения, а также надлежащим материальным и социальным обеспечением.','2. Добропорядочность и этика: Обязанность соблюдать высокие стандарты морали, профессиональной этики и предотвращать любой конфликт интересов.']],
['Ст. 5','Органы судейского управления и самоуправления','',['1. Организационное обеспечение деятельности судов и защита профессиональных интересов судей осуществляются через Высший совет правосудия, Высшую квалификационную комиссию судей Украины и Совет судей Украины.']],
['Ст. 6','Право судьи на ношение оружия','',['1. С целью обеспечения личной безопасности и защиты от противоправных посягательств в связи с осуществлением правосудия судья имеет право на ношение и хранение оружия в порядке, установленном законодательством.']],
['Ст. 7','Доступ судьи Верховного Суда на территории','',['1. Судья Верховного Суда для осуществления своей деятельности и выполнения профессиональных обязанностей имеет право беспрепятственного доступа и входа на любую территорию, объект или помещение.']]]},
{b:3,i:'📑',s:'КОДЕКС СУДЕБНОЙ ВЛАСТИ',c:'Процесс',t:'СОСТАВ СУДА, УЧАСТНИКИ И ДОКАЗАТЕЛЬСТВА',r:[
['Ст. 8','Состав суда и участники процесса','',['1. Рассмотрение дел осуществляется судьёй единолично, коллегиально или с участием присяжных.','2. Участниками процесса являются стороны (истец, ответчик, обвиняемый, потерпевший), прокурор, адвокат (представитель) и третьи лица.','3. Участники имеют право на правовую помощь, ознакомление с материалами дела, подачу ходатайств и выражение возражений.']],
['Ст. 9','Доказательства и особенности доказывания','',['1. Доказательствами являются любые данные, на основании которых суд в установленном законом порядке устанавливает наличие или отсутствие обстоятельств дела (письменные, вещественные, электронные доказательства, заключения экспертов, показания свидетелей).','2. Если судья был непосредственно при задержании лица, сторона обвинения освобождается от обязанности представления дополнительных доказательств относительно факта задержания и связанных с ним обстоятельств, подтверждённых личным наблюдением судьи.']]]}
